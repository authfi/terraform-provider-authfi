# Releases the provider when a version tag (vX.Y.Z) is pushed: GoReleaser builds the archives, signs the checksum
# file with the release GPG key and publishes a GitHub Release, which the Terraform Registry picks up through the
# webhook it set on this repository. The Registry only accepts GPG signatures, and has no OpenID Connect login, so
# the signing key is a secret (GPG_PRIVATE_KEY, GPG_PASSPHRASE) of the `terraform-registry` environment only, never a
# repository secret; the job that reads it starts after a reviewer's approval. Build provenance is attested too.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a version on main, with a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          v="${TAG#v}"
          grep -Eq "^## \[?${v//./\.}\]?( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: terraform-registry
      url: https://registry.terraform.io/providers/authfi/authfi
    permissions:
      contents: write # create the release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'BEGIN{a="## "v; b="## ["v"]"} $0==a || index($0,a" ")==1 || $0==b || index($0,b" ")==1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::no release notes for $v"; exit 1; }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
      - name: Find the checksum file
        run: echo "SUMS=$(ls dist/*_SHA256SUMS)" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ env.SUMS }}
